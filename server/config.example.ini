# Settings for the website sync on the planner server.
# Copy to server/config.ini, fill in the token, then: chmod 600 server/config.ini

[api]
# Address of the budget API, with no trailing slash
url = https://budget-api.lucaguiga.com
# The machine token for the budget API. Never put it anywhere else.
token =
# Seconds between requests, to stay under the API's rate limit
request_gap = 0.3

[sync]
# Seconds between checks for new edits
poll_seconds = 2
# Where accounts and everyone's budgets are kept on this server (relative to the project folder)
data_dir = data/web

[passwords]
# How passwords are hashed. These must match the budget API's login check,
# so copy them from the API's settings.
scrypt_n = 16384
scrypt_r = 8
scrypt_p = 1
length = 64
# How the salt and hash are written: hex or base64
encoding = hex
